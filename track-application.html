<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Request | Maa Enterprises</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">Maa Enterprises</a>
            <div class="nav-links">
                <a href="services.html">Services</a>
                <a href="index.html">Home</a>
            </div>
        </div>
    </nav>
    <main class="container section" style="max-width: 600px; min-height: 70vh;">
        <div class="card">
            <h2 style="margin-bottom: 8px;">Public Tracking</h2>
            <p class="text-muted" style="margin-bottom: 24px;">Enter your Acknowledgement Number. Note: For full details, please login and visit 'My Applications'.</p>
            
            <form id="track-form">
                <div class="form-group">
                    <label class="form-label">Acknowledgement Number</label>
                    <input type="text" id="track-ack" class="form-control" placeholder="e.g. ME-2026-123456" required>
                </div>
                <button type="submit" id="track-btn" class="btn btn-primary" style="width:100%;">Track Status</button>
            </form>

            <div id="track-error" class="hidden" style="margin-top: 16px;"></div>

            <div id="track-result" class="hidden" style="margin-top: 24px; padding: 24px; background: #f8fafc; border: 1px solid var(--border); border-radius: var(--radius);">
                <div style="display: flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                    <strong id="res-ack" style="color:var(--primary); font-size:1.1rem;"></strong>
                    <span id="res-status" class="badge"></span>
                </div>
                <h3 id="res-service" style="margin-bottom:8px;"></h3>
                <p class="text-muted" id="res-date"></p>
                <hr style="margin:16px 0; border:0; border-top: 1px solid var(--border);">
                <p style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0;">
                    <strong>Payment Status:</strong> 
                    <span id="res-payment" class="badge"></span>
                </p>
            </div>
        </div>
    </main>
    <footer class="footer"><div class="container footer-bottom"><p>&copy; 2026 Maa Enterprises.</p></div></footer>
    <script type="module" src="js/tracking.js"></script>
</body>
</html>
