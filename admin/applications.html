<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Applications | Admin</title>
    <link rel="stylesheet" href="../css/admin-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="admin-layout">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div class="admin-brand">
                <h2>MAA ADMIN</h2>
                <span class="badge">Live</span>
            </div>
            <nav class="admin-nav">
                <a href="index.html"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
                <a href="applications.html" class="active"><i class="fa-solid fa-folder-open"></i> Applications</a>
                <a href="services.html"><i class="fa-solid fa-list-check"></i> Services</a>
                <a href="faqs.html"><i class="fa-solid fa-circle-question"></i> FAQs</a>
                <a href="settings.html"><i class="fa-solid fa-gear"></i> Settings</a>
            </nav>
            <div class="admin-user-box">
                <span style="font-size: 0.7rem; text-transform: uppercase; color: #64748b; font-weight: 700;">Logged In Admin</span>
                <p id="admin-user-email" class="admin-user-email">Syncing...</p>
                <a href="#" id="admin-logout" class="admin-logout-btn"><i class="fa-solid fa-right-from-bracket"></i> Secure Logout</a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="admin-content">
            <div class="admin-topbar">
                <div>
                    <h1 class="admin-title">Customer Applications</h1>
                    <p style="color: var(--admin-text-muted); font-size: 0.95rem; margin-top: 4px;">Review and manage incoming service applications</p>
                </div>
            </div>

            <div id="backend-alert" class="hidden"></div>
            <div id="loading-state" style="text-align: center; padding: 40px; color: var(--admin-text-muted);"><i class="fa-solid fa-spinner fa-spin"></i> Syncing secure database...</div>
            
            <div id="app-list" class="grid-cards hidden"></div>
        </main>
    </div>

    <!-- Edit Application Modal -->
    <div id="edit-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3 style="font-size: 1.25rem; font-weight: 700;">Update Application Status</h3>
                <button id="close-modal" class="modal-close">&times;</button>
            </div>
            <form id="update-form">
                <input type="hidden" id="edit-id">
                <div class="form-group">
                    <label class="form-label">Application Status</label>
                    <select id="edit-status" class="form-control">
                        <option value="Pending">Pending</option>
                        <option value="Processing">Processing</option>
                        <option value="Completed">Completed</option>
                        <option value="Rejected">Rejected</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Payment Verification</label>
                    <select id="edit-payment" class="form-control">
                        <option value="Pending">Pending</option>
                        <option value="Verified">Verified</option>
                    </select>
                </div>
                <button type="submit" id="save-btn" class="btn btn-primary" style="width:100%; margin-top: 12px; padding: 14px;">
                    Commit Changes
                </button>
            </form>
        </div>
    </div>

    <script type="module" src="../js/admin/admin-applications.js"></script>
</body>
</html>
