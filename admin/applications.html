<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Applications | Admin</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <h2>MAA ADMIN</h2>
            <div class="admin-nav">
                <a href="index.html">Dashboard</a>
                <a href="applications.html" class="active">Applications</a>
                <a href="services.html">Services</a>
                <a href="faqs.html">FAQs</a>
                <a href="settings.html">Settings</a>
                <hr style="border:0; border-top: 1px solid #334155; margin: 16px 0;">
                <a href="#" id="admin-logout" style="color:#ef4444;">Secure Logout</a>
            </div>
        </aside>
        <main class="admin-content">
            <h1 style="margin-bottom: 24px;">Application Management</h1>
            
            <div id="backend-alert" class="hidden"></div>
            <div id="loading-state">Syncing secure database...</div>
            <div id="app-list" class="grid hidden"></div>
        </main>
    </div>
    
    <div id="edit-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3 style="color:var(--text-main);">Update Status</h3>
                <button id="close-modal" class="modal-close">&times;</button>
            </div>
            <form id="update-form">
                <input type="hidden" id="edit-id">
                <div class="form-group">
                    <label class="form-label">Application Status</label>
                    <select id="edit-status" class="form-control">
                        <option value="Pending">Pending</option>
                        <option value="Processing">Processing</option>
                        <option value="Completed">Completed</option>
                        <option value="Rejected">Rejected</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Payment Verification</label>
                    <select id="edit-payment" class="form-control">
                        <option value="Pending">Pending</option>
                        <option value="Verified">Verified</option>
                    </select>
                </div>
                <button type="submit" id="save-btn" class="btn btn-primary" style="width:100%; margin-top:8px;">Commit Changes to Backend</button>
            </form>
        </div>
    </div>
    <script type="module" src="../js/admin/admin-applications.js"></script>
</body>
</html>
