<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage FAQs | Admin</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <h2>MAA ADMIN</h2>
            <div class="admin-nav">
                <a href="index.html">Dashboard</a>
                <a href="applications.html">Applications</a>
                <a href="services.html">Services</a>
                <a href="faqs.html" class="active">FAQs</a>
                <a href="settings.html">Settings</a>
                <hr style="border:0; border-top:1px solid #334155; margin: 10px 0;">
                <a href="#" id="admin-logout" style="color:#ef4444;">Logout</a>
            </div>
        </aside>
        <main class="admin-content">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h1>FAQs</h1>
                <button id="add-new-btn" class="btn btn-primary">Add FAQ</button>
            </div>
            <br>
            <div id="backend-alert" class="hidden"></div>
            <div id="loading-state">Loading FAQs...</div>
            <div id="faq-list" class="grid hidden"></div>
        </main>
    </div>

    <div id="faq-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>FAQ Entry</h3>
                <button id="close-modal" class="modal-close">&times;</button>
            </div>
            <form id="faq-form">
                <input type="hidden" id="faq-id">
                <div class="form-group">
                    <label class="form-label">Question</label>
                    <input type="text" id="faq-q" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Answer</label>
                    <textarea id="faq-a" class="form-control" rows="3" required></textarea>
                </div>
                <button type="submit" id="save-btn" class="btn btn-primary" style="width:100%;">Save</button>
            </form>
        </div>
    </div>
    <script type="module" src="../js/admin/admin-faqs.js"></script>
</body>
</html>
