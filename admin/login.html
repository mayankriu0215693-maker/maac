<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - MAA ENTERPRISES</title>
</head>
<body>
    <div style="max-width: 400px; margin: 50px auto; text-align: center;">
        <h2>Admin Portal Login</h2>
        
        <div id="admin-error" style="color: red; display: none; margin-bottom: 10px;"></div>

        <input type="text" id="admin-id" placeholder="Admin ID" style="width: 100%; padding: 10px; margin-bottom: 10px;">
        <input type="password" id="admin-pwd" placeholder="Password" style="width: 100%; padding: 10px; margin-bottom: 20px;">
        
        <button id="btn-admin-login" style="width: 100%; padding: 10px; background: #333; color: white;">
            Login to Dashboard
        </button>
    </div>

    <script type="module" src="../admin-auth.js"></script>
</body>
</html>
