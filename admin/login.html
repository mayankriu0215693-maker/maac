<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Maa Enterprises</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body style="background: #0f172a; color: white;">
    <main class="container section" style="max-width: 400px; margin-top: 10vh;">
        <div class="card" style="background: #1e293b; border: 1px solid #334155;">
            <h2 class="text-center" style="color: #3b82f6; letter-spacing:1px;">ADMIN PORTAL</h2>
            <p class="text-center" style="color: #94a3b8; margin-bottom: 32px;">Maa Enterprises Cyber Cafe</p>
            
            <div id="auth-error" class="hidden"></div>
            
            <form id="admin-login-form">
                <div class="form-group">
                    <label class="form-label" style="color:#e2e8f0;">Admin ID</label>
                    <input type="text" id="admin-id" class="form-control" required style="background:#0f172a; color:white; border:1px solid #475569;" placeholder="Enter ID">
                </div>
                <div class="form-group">
                    <label class="form-label" style="color:#e2e8f0;">Password</label>
                    <input type="password" id="admin-pass" class="form-control" required style="background:#0f172a; color:white; border:1px solid #475569;" placeholder="Enter password">
                </div>
                <button type="submit" id="login-btn" class="btn btn-primary" style="width:100%; margin-top:16px;">Secure Login</button>
            </form>
            
            <div style="margin-top: 24px; text-align:center;">
                <a href="../index.html" style="color: #64748b; font-size:0.875rem;">&larr; Return to Public Website</a>
            </div>
        </div>
    </main>
    <script type="module" src="../js/admin/admin-auth.js"></script>
</body>
</html>
