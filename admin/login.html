<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Maa Enterprises</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body style="background: #0f172a; color: white;">
    <main class="container section" style="max-width: 400px; margin-top: 10vh;">
        <div class="card" style="background: #1e293b; border: 1px solid #334155;">
            <h2 class="text-center" style="color: #3b82f6;">ADMIN PORTAL</h2>
            <p class="text-center text-muted" style="margin-bottom: 20px;">Maa Enterprises Cyber Cafe</p>
            <div id="auth-error" class="hidden"></div>
            <form id="admin-login-form">
                <div class="form-group">
                    <label class="form-label" style="color:#e2e8f0;">Admin Email</label>
                    <input type="email" id="admin-email" class="form-control" required style="background:#334155; color:white; border:none;">
                </div>
                <div class="form-group">
                    <label class="form-label" style="color:#e2e8f0;">Password</label>
                    <input type="password" id="admin-pass" class="form-control" required style="background:#334155; color:white; border:none;">
                </div>
                <button type="submit" id="login-btn" class="btn btn-primary" style="width:100%;">Secure Login</button>
            </form>
            <div style="margin-top: 20px; text-align:center;">
                <a href="../index.html" style="color: #94a3b8; font-size:0.875rem;">&larr; Back to Public Site</a>
            </div>
        </div>
    </main>
    <script type="module" src="../js/admin/admin-auth.js"></script>
</body>
</html>
