<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - MAA ENTERPRISES</title>
    <!-- Use root CSS file -->
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="admin-login-container">
        <h2>MAA ENTERPRISES</h2>
        <h3>Admin Portal</h3>
        
        <div id="admin-error" style="color: red; display: none; margin-bottom: 10px;"></div>

        <input type="text" id="admin-id" placeholder="Admin ID (e.g., K0403489)">
        <input type="password" id="admin-pwd" placeholder="Password">
        
        <button onclick="adminLogin()">Access Dashboard</button>
    </div>

    <!-- Ensure Auth logic from root is loaded -->
    <script type="module" src="../admin-auth.js"></script>
</body>
</html>
