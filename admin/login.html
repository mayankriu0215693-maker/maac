<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Maa Enterprises</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body style="background: #111827; color: white;">
    <main class="container section" style="max-width: 400px; margin-top: 10vh;">
        <div class="card" style="background: #1f2937; border: 1px solid #374151;">
            <h2 class="text-center" style="color: #60a5fa;">ADMIN PORTAL</h2>
            <p class="text-center text-muted" style="margin-bottom: 20px;">Maa Enterprises Cyber Cafe</p>
            
            <div id="auth-error"></div>

            <form id="admin-login-form">
                <div class="form-group">
                    <label class="form-label" style="color:#e5e7eb;">Admin Email</label>
                    <input type="email" id="admin-email" class="form-control" required style="background:#374151; color:white; border:none;">
                </div>
                <div class="form-group">
                    <label class="form-label" style="color:#e5e7eb;">Password</label>
                    <input type="password" id="admin-pass" class="form-control" required style="background:#374151; color:white; border:none;">
                </div>
                <br>
                <button type="submit" id="login-btn" class="btn btn-primary" style="width:100%;">Secure Login</button>
            </form>
            <div style="margin-top: 20px; text-align:center;">
                <a href="../index.html" style="color: #9ca3af; font-size:0.875rem;">&larr; Back to Public Website</a>
            </div>
        </div>
    </main>
    <script type="module" src="../js/admin/admin-auth.js"></script>
</body>
</html>
