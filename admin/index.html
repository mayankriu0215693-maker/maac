<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Admin</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <h2>MAA ADMIN</h2>
            <div class="admin-nav">
                <a href="index.html" class="active">Dashboard</a>
                <a href="applications.html">Applications</a>
                <a href="services.html">Services</a>
                <a href="faqs.html">FAQs</a>
                <a href="settings.html">Settings</a>
                <hr style="border:0; border-top: 1px solid #334155; margin: 16px 0;">
                <p id="admin-user-email" style="font-size:0.85rem; color:#94a3b8; word-break:break-all; margin-bottom:8px;"></p>
                <a href="#" id="admin-logout" style="color:#ef4444;">Secure Logout</a>
            </div>
        </aside>
        <main class="admin-content">
            <h1 style="margin-bottom: 24px;">System Dashboard</h1>
            
            <div id="backend-alert" class="hidden"></div>
            
            <div class="grid grid-3">
                <div class="card" style="border-left: 4px solid var(--primary);">
                    <h3 class="text-muted" style="font-size: 1rem; margin-bottom: 8px;">Total Applications</h3>
                    <h2 id="stat-total" style="font-size: 2.5rem;">-</h2>
                </div>
                <div class="card" style="border-left: 4px solid var(--warning);">
                    <h3 class="text-muted" style="font-size: 1rem; margin-bottom: 8px;">Pending Action</h3>
                    <h2 id="stat-pending" style="font-size: 2.5rem;">-</h2>
                </div>
                <div class="card" style="border-left: 4px solid var(--success);">
                    <h3 class="text-muted" style="font-size: 1rem; margin-bottom: 8px;">Active Services</h3>
                    <h2 id="stat-services" style="font-size: 2.5rem;">-</h2>
                </div>
            </div>
        </main>
    </div>
    <script type="module" src="../js/admin/admin-dashboard.js"></script>
</body>
</html>
