<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | Maa Enterprises</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">Maa Enterprises</a>
            <div class="nav-links">
                <a href="applications.html">My Applications</a>
                <a href="index.html">Home</a>
            </div>
        </div>
    </nav>
    <main class="container section" style="max-width: 500px; min-height: 70vh;">
        <div id="loading-state" class="text-center">Loading secure profile...</div>
        
        <div id="profile-card" class="card hidden text-center">
            <img src="" id="prof-img" class="user-profile-pic hidden" style="width:80px; height:80px; margin: 0 auto 16px auto;" alt="Profile Picture">
            <h2 style="margin-bottom: 24px;">My Profile</h2>
            
            <div id="profile-error" class="hidden"></div>
            
            <div class="form-group">
                <label class="form-label text-muted">Full Name</label>
                <p id="prof-name" style="font-weight: 600; font-size: 1.1rem;">-</p>
            </div>
            <div class="form-group">
                <label class="form-label text-muted">Google Email Address</label>
                <p id="prof-email" style="font-size: 1.05rem;">-</p>
            </div>
            <div class="form-group">
                <label class="form-label text-muted">Account Registered</label>
                <p id="prof-date">-</p>
            </div>
            
            <hr style="margin: 24px 0; border:0; border-top: 1px solid var(--border);">
            
            <a href="#" class="btn btn-outline logout-btn" style="width:100%;">Logout Safely</a>
        </div>
    </main>
    <footer class="footer"><div class="container footer-bottom"><p>&copy; 2026 Maa Enterprises.</p></div></footer>
    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/profile.js"></script>
</body>
</html>
