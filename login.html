<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login - MAA ENTERPRISES</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <h2>Sign in to continue</h2>
        
        <div id="auth-error" style="color: red; display: none; margin-bottom: 10px;"></div>

        <button onclick="loginWithGoogle()" class="btn-google">Continue with Google</button>

        <!-- Hidden by default until JS confirms setting is TRUE -->
        <div id="mobile-auth-wrapper" style="display: none;">
            <div class="divider">------------ OR ------------</div>
            
            <div id="phone-section">
                <input type="text" id="phone-number" placeholder="+91XXXXXXXXXX">
                <button onclick="sendOTP()">Send OTP</button>
            </div>

            <div id="otp-section" style="display: none;">
                <p>Enter the 6-digit OTP</p>
                <input type="text" id="otp-code" placeholder="000000" maxlength="6">
                <button onclick="verifyOTP()">Verify OTP</button>
            </div>
            
            <div id="recaptcha-container"></div>
        </div>
    </div>

    <!-- Ensure logic runs -->
    <script type="module">
        import { loadAuthSettings } from './auth.js';
        
        // Expose functions globally for HTML onclick handlers
        import './auth.js';
        
        document.addEventListener("DOMContentLoaded", () => {
            loadAuthSettings();
        });
    </script>
</body>
</html>
