<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login - MAA ENTERPRISES</title>
    <!-- Add your existing CSS links here -->
</head>
<body>

    <!-- NAVBAR PLACEHOLDER -->
    <nav>
        <div>MAA ENTERPRISES</div>
        <div id="nav-auth-state">
            <a href="login.html">Login</a>
        </div>
    </nav>

    <div class="login-container" style="max-width: 400px; margin: 50px auto; text-align: center;">
        <h2>Sign in to continue</h2>
        
        <div id="error-message" style="color: red; display: none; margin-bottom: 10px;"></div>

        <!-- Google Login -->
        <button id="btn-google-login" style="width: 100%; padding: 10px; margin-bottom: 20px;">
            Continue with Google
        </button>

        <div id="otp-section-wrapper" style="display: none;">
            <p>------------ OR ------------</p>
            
            <!-- Phone Input State -->
            <div id="phone-input-state">
                <div style="display: flex; margin-bottom: 10px;">
                    <span style="padding: 10px; background: #eee;">+91</span>
                    <input type="text" id="phone-number" placeholder="Mobile Number" style="flex: 1; padding: 10px;" maxlength="10">
                </div>
                <button id="btn-send-otp" style="width: 100%; padding: 10px;">Send OTP</button>
            </div>

            <!-- OTP Verification State -->
            <div id="otp-verify-state" style="display: none;">
                <p>Enter the 6-digit OTP</p>
                <input type="text" id="otp-code" placeholder="6-digit OTP" style="width: 100%; padding: 10px; margin-bottom: 10px;" maxlength="6">
                <button id="btn-verify-otp" style="width: 100%; padding: 10px;">Verify OTP</button>
            </div>
            
            <div id="recaptcha-container" style="margin-top: 10px;"></div>
        </div>
    </div>

    <!-- Firebase App, Auth, Firestore Modules -->
    <script type="module" src="auth.js"></script>
</body>
</html>
