<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Access - MAA ENTERPRISES</title>
    <link rel="stylesheet" href="auth-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-body">
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-brand-logo">
                <h1>MAA ENTERPRISES</h1>
                <p>Digital Service Center</p>
            </div>

            <!-- STATE 1: GUEST / NOT LOGGED IN -->
            <div id="login-guest-section">
                <h2>Welcome Back</h2>
                <p>Sign in with your Google account to access your digital services</p>
                
                <div id="auth-alert" class="auth-alert error" style="display: none;"></div>
                
                <button id="btn-google" class="btn-google">
                    <svg viewBox="0 0 24 24" width="20" height="20" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                    Continue with Google
                </button>
            </div>

            <!-- STATE 2: ALREADY LOGGED IN USER -->
            <div id="login-active-section" style="display: none;">
                <div style="width: 70px; height: 70px; border-radius: 50%; background: #e0f2fe; color: #0284c7; display: flex; align-items: center; justify-content: center; font-size: 2rem; margin: 0 auto 16px;">
                    <i class="fa-solid fa-user-check"></i>
                </div>
                <h2>Already Signed In</h2>
                <p id="user-display-info" style="font-weight: 600; color: #0f172a; margin-bottom: 24px;">Loading...</p>
                
                <div style="display: flex; flex-direction: column; gap: 12px;">
                    <a href="profile.html" class="btn-primary" style="padding: 12px; text-decoration: none; border-radius: 8px; font-weight: 600;">
                        <i class="fa-solid fa-id-card"></i> View My Profile
                    </a>
                    <a href="applications.html" class="btn-primary" style="padding: 12px; text-decoration: none; border-radius: 8px; font-weight: 600; background: #0f3460;">
                        <i class="fa-solid fa-folder-open"></i> My Applications
                    </a>
                    <button id="btn-active-logout" class="btn-google" style="margin-top: 6px; border-color: #ef4444; color: #ef4444;">
                        <i class="fa-solid fa-right-from-bracket"></i> Logout Safely
                    </button>
                </div>
            </div>

            <div class="auth-footer" style="margin-top: 25px;">
                <a href="index.html">&larr; Back to Website</a>
                <span class="security-badge">&#128274; Secured by Firebase</span>
            </div>
        </div>
    </div>

    <script type="module" src="js/auth.js"></script>
</body>
</html>
