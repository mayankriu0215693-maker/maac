<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Maa Enterprises</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">Maa Enterprises</a>
        </div>
    </nav>
    <main class="container section" style="max-width: 400px; margin-top: 50px; min-height: 70vh;">
        <div class="card">
            <h2 class="text-center">Customer Login</h2>
            <p class="text-center text-muted" style="margin-bottom: 20px;">Access your applications</p>
            
            <div id="auth-error"></div>

            <form id="login-form">
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" id="login-email" class="form-control" required placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="login-pass" class="form-control" required placeholder="Enter your password">
                </div>
                <br>
                <button type="submit" id="login-btn" class="btn btn-primary" style="width:100%;">Login</button>
            </form>
            <p class="text-center" style="margin-top:16px;">Don't have an account? <a href="signup.html">Sign up</a></p>
        </div>
    </main>
    <footer class="footer"><p>&copy; 2026 Maa Enterprises Cyber Cafe.</p></footer>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
