<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login | Maa Enterprises</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">Maa Enterprises</a>
        </div>
    </nav>
    <main class="container section" style="max-width: 450px; min-height: 70vh; display:flex; align-items:center;">
        <div class="card" style="width:100%; text-align:center;">
            <h2 style="margin-bottom: 8px;">Customer Login</h2>
            <p class="text-muted" style="margin-bottom: 32px;">Continue securely to manage your applications</p>
            
            <div id="auth-error" class="hidden"></div>
            
            <button id="google-login-btn" class="btn btn-google">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                <span id="btn-text">Continue with Google</span>
            </button>

            <p class="text-muted" style="margin-top:24px; font-size: 0.85rem;">
                By continuing, you agree to Maa Enterprises' secure data processing. We do not store sensitive identification documents on this website.
            </p>
        </div>
    </main>
    <footer class="footer"><div class="container footer-bottom"><p>&copy; 2026 Maa Enterprises.</p></div></footer>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
