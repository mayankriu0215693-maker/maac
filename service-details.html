<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Details | Maa Enterprises</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">Maa Enterprises</a>
        </div>
    </nav>

    <main class="container section">
        <div id="loading-state">Loading service details...</div>
        
        <div id="details-card" class="card hidden">
            <h2 id="s-name"></h2>
            <p id="s-desc" class="text-muted"></p>
            <hr style="margin: 16px 0; border:0; border-top:1px solid #e5e7eb;">
            
            <div class="grid">
                <div>
                    <h3>Information</h3>
                    <p><strong>Service Fee:</strong> <span id="s-fee"></span></p>
                    <p><strong>Processing Time:</strong> <span id="s-time"></span></p>
                </div>
                <div>
                    <h3>Required Documents</h3>
                    <p class="text-muted" style="font-size:0.875rem; margin-bottom:8px;">⚠️ These documents must be sent via WhatsApp AFTER you submit your application here.</p>
                    <ul id="s-docs" style="list-style:disc; padding-left:20px;"></ul>
                </div>
            </div>
            
            <br>
            <a id="apply-btn" href="#" class="btn btn-primary">Proceed to Apply</a>
        </div>
    </main>

    <script type="module" src="js/service-details.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
