<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Maa Enterprises</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">Maa Enterprises</a>
        </div>
    </nav>
    <main class="container section" style="max-width: 400px; min-height: 70vh; display:flex; align-items:center;">
        <div class="card" style="width:100%;">
            <h2 class="text-center">Create Account</h2>
            <p class="text-center text-muted" style="margin-bottom: 20px;">Secure your online applications</p>
            <div id="auth-error" class="hidden"></div>
            <form id="signup-form">
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" id="reg-name" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" id="reg-email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password (Min 6 chars)</label>
                    <input type="password" id="reg-pass" class="form-control" minlength="6" required>
                </div>
                <button type="submit" id="reg-btn" class="btn btn-primary" style="width:100%;">Sign Up</button>
            </form>
            <p class="text-center" style="margin-top:16px;">Already registered? <a href="login.html">Login</a></p>
        </div>
    </main>
    <footer class="footer"><p>&copy; 2026 Maa Enterprises.</p></footer>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
