<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Maa Enterprises</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="container section" style="max-width: 400px; margin-top: 50px;">
        <div class="card">
            <h2 class="text-center">Create Account</h2>
            <br>
            <form id="signup-form">
                <div class="form-group">
                    <label class="form-label">Name</label>
                    <input type="text" id="reg-name" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" id="reg-email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="reg-pass" class="form-control" minlength="6" required>
                </div>
                <div id="auth-error" class="error-msg"></div>
                <br>
                <button type="submit" id="reg-btn" class="btn btn-primary" style="width:100%;">Sign Up</button>
            </form>
            <p class="text-center" style="margin-top:16px;">Already have an account? <a href="login.html">Login</a></p>
        </div>
    </main>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
